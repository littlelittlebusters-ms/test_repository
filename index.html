<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --gold: #c8a45c;
      --gold-light: #e8d5a3;
      --dark: #1a1a2e;
      --dark-mid: #16213e;
      --dark-light: #0f3460;
      --text: #eee;
      --text-muted: #aaa;
      --card-bg: rgba(255,255,255,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-mid) 50%, var(--dark-light) 100%);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      border-bottom: 1px solid rgba(200,164,92,0.3);
    }

    header h1 {
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* --- Filters --- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .filter-group label {
      font-size: 0.75rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .filter-group select,
    .filter-group input {
      padding: 0.5rem 0.8rem;
      border: 1px solid rgba(200,164,92,0.4);
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-group select:focus,
    .filter-group input:focus {
      border-color: var(--gold);
    }

    .filter-group select option {
      background: var(--dark-mid);
      color: var(--text);
    }

    .btn-recommend {
      padding: 0.55rem 1.5rem;
      background: linear-gradient(135deg, var(--gold), #a8893a);
      color: var(--dark);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      align-self: flex-end;
    }

    .btn-recommend:hover { opacity: 0.85; }

    .btn-reset {
      padding: 0.55rem 1rem;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      align-self: flex-end;
    }

    .btn-reset:hover { color: var(--text); border-color: rgba(255,255,255,0.4); }

    /* --- Cards --- */
    .results-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(200,164,92,0.15);
      border-radius: 10px;
      padding: 1.3rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(200,164,92,0.5);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.6rem;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--gold-light);
    }

    .card-category {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      background: rgba(200,164,92,0.2);
      color: var(--gold);
      white-space: nowrap;
    }

    .card-maker {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 0.8rem;
    }

    .card-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .card-meta span::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      margin-right: 0.3rem;
      vertical-align: middle;
    }

    .stars {
      color: var(--gold);
      letter-spacing: 1px;
    }

    .no-results {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      .filters { flex-direction: column; }
      .filter-group { width: 100%; }
      .filter-group select, .filter-group input { width: 100%; }
    }
  </style>
</head>

function getPriceLabel(level) {
  switch(level) {
    case 1: return "〜2,000円";
    case 2: return "2,000〜5,000円";
    case 3: return "5,000〜10,000円";
    case 4: return "10,000円〜";
    default: return "";
  }
}

function renderStars(n) {
  return "★".repeat(n) + "☆".repeat(5 - n);
}

function renderCards(items) {

    noResults.style.display = "block";
    count.textContent = "";
    return;

  noResults.style.display = "none";
  count.textContent = `${items.length} 件の洋酒が見つかりました`;

  grid.innerHTML = items.map(s => `
    <div class="card">
      <div class="card-header">
        <span class="card-name">${s.name}</span>
        <span class="card-category">${s.category}</span>
      </div>
      <div class="card-maker">${s.maker}</div>
      <div class="card-desc">${s.description}</div>
      <div class="card-meta">
        <span>${s.taste.join(" / ")}</span>
        <span>${getPriceLabel(s.price)}</span>
        <span class="stars">${renderStars(s.rating)}</span>
      </div>
    </div>
  `).join("");
}

function applyFilters() {
  const category = document.getElementById("filterCategory").value;
  const taste = document.getElementById("filterTaste").value;
  const price = document.getElementById("filterPrice").value;
  const keyword = document.getElementById("filterKeyword").value.trim().toLowerCase();

  let results = spirits;

  if (category) {
    results = results.filter(s => s.category === category);
  }
  if (taste) {
    results = results.filter(s => s.taste.includes(taste));
  }
  if (price) {
    results = results.filter(s => s.price === parseInt(price));
  }
  if (keyword) {
    results = results.filter(s =>
      s.name.toLowerCase().includes(keyword) ||
      s.maker.toLowerCase().includes(keyword) ||
      s.description.toLowerCase().includes(keyword) ||
      s.keywords.some(k => k.toLowerCase().includes(keyword))
    );
  }

  renderCards(results);
}

function resetFilters() {
  document.getElementById("filterCategory").value = "";
  document.getElementById("filterTaste").value = "";
  document.getElementById("filterPrice").value = "";
  document.getElementById("filterKeyword").value = "";
  renderCards(spirits);
}

// Initial render
renderCards(spirits);

// Allow Enter key to trigger search
document.getElementById("filterKeyword").addEventListener("keydown", function(e) {
  if (e.key === "Enter") applyFilters();
});
</script>

</body>
</html>
